    <!-- Подключаем красивый шрифт Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        /* Сброс стилей */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        /* Темный, глубокий фон с легким оранжевым свечением */
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #0f0f11;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(245, 124, 0, 0.15), transparent 40%),
                radial-gradient(circle at 85% 30%, rgba(230, 81, 0, 0.15), transparent 40%);
            color: #ffffff;
            overflow: hidden;
            position: relative;
            -webkit-font-smoothing: antialiased;
        }

        /* Основной контейнер (матовое стекло) */
        .main-container {
            position: relative;
            z-index: 10;
            background: rgba(25, 25, 28, 0.6);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 32px;
            padding: 60px 80px;
            box-shadow: 
                0 30px 60px rgba(0, 0, 0, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            text-align: center;
            max-width: 900px;
            width: 90%;
            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Часы и приветствие */
        .time-display {
            font-size: 96px;
            font-weight: 700;
            letter-spacing: -2px;
            line-height: 1;
            background: linear-gradient(135deg, #ffffff, #a0a0a0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .date-display {
            font-size: 16px;
            font-weight: 400;
            color: #888888;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 40px;
        }

        .greeting {
            font-size: 24px;
            font-weight: 300;
            color: #e0e0e0;
            margin-bottom: 40px;
        }

        .greeting span {
            font-weight: 600;
            color: #F57C00;
        }

        /* Строка поиска */
        .search-wrapper {
            position: relative;
            max-width: 600px;
            margin: 0 auto 50px auto;
        }

        .search-wrapper input {
            width: 100%;
            padding: 20px 30px;
            padding-right: 120px;
            font-size: 18px;
            font-weight: 400;
            color: #ffffff;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 100px;
            outline: none;
            transition: all 0.3s ease;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
        }

        .search-wrapper input::placeholder {
            color: #666666;
        }

        .search-wrapper input:focus {
            background: rgba(0, 0, 0, 0.5);
            border-color: #F57C00;
            box-shadow: 0 0 0 4px rgba(245, 124, 0, 0.15);
        }

        .search-wrapper button {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            padding: 12px 30px;
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
            background: #F57C00;
            border: none;
            border-radius: 100px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(245, 124, 0, 0.3);
        }

        .search-wrapper button:hover {
            background: #E65100;
            transform: translateY(-50%) scale(1.02);
        }

        .search-wrapper button:active {
            transform: translateY(-50%) scale(0.98);
        }

        /* Плитки сайтов */
        .tiles-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .tile {
            text-decoration: none;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 20px 10px;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #cccccc;
        }

        .tile:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.15);
            transform: translateY(-5px);
            color: #ffffff;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .tile svg {
            width: 32px;
            height: 32px;
            margin-bottom: 12px;
            fill: currentColor;
            transition: fill 0.3s ease;
        }

        .tile:hover svg {
            fill: #F57C00;
        }

        /* Цветные иконки (ВК, Mail.ru) */
        .tile-img {
            width: 32px;
            height: 32px;
            margin-bottom: 12px;
            border-radius: 8px;
            display: block;
            filter: saturate(0.85);
            transition: filter 0.3s ease, transform 0.3s ease;
        }

        .tile:hover .tile-img {
            filter: saturate(1);
            transform: scale(1.08);
        }

        /* Википедия: буква W красится в цвет текста, при наведении — оранжевая */
        .tile-mask {
            width: 32px;
            height: 32px;
            margin-bottom: 12px;
            display: block;
            background-color: currentColor;
            -webkit-mask-repeat: no-repeat;
            mask-repeat: no-repeat;
            -webkit-mask-position: center;
            mask-position: center;
            -webkit-mask-size: contain;
            mask-size: contain;
            transition: background-color 0.3s ease;
        }

        .tile:hover .tile-mask {
            background-color: #F57C00;
        }

        .tile span {
            font-size: 14px;
            font-weight: 500;
        }

        /* Подвал */
        .footer {
            position: absolute;
            bottom: 30px;
            font-size: 13px;
            font-weight: 400;
            color: #555555;
            z-index: 10;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .footer img {
            width: 16px;
            height: 16px;
            opacity: 0.9;
        }

        /* ===== Мобильная версия ===== */
        @media all {
            body {
                min-height: 100vh;
                min-height: 100dvh;
                justify-content: flex-start;
                overflow-x: hidden;
                overflow-y: auto;
                padding: max(24px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom));
            }

            .main-container {
                margin: auto 0;
                width: 100%;
                padding: 36px 20px 28px;
                border-radius: 28px;
            }

            .time-display {
                font-size: 68px;
                letter-spacing: -1px;
            }

            .date-display {
                font-size: 13px;
                margin-bottom: 24px;
            }

            .greeting {
                font-size: 20px;
                margin-bottom: 28px;
            }

            .search-wrapper {
                margin-bottom: 32px;
            }

            .search-wrapper input {
                font-size: 16px; /* не даёт iOS приближать страницу при вводе */
                padding: 16px 20px;
                padding-right: 100px;
            }

            .search-wrapper button {
                padding: 10px 18px;
                font-size: 15px;
            }

            .tiles-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 12px;
                margin-top: 0;
            }

            .tile {
                padding: 16px 6px;
                border-radius: 18px;
            }

            .tile span {
                font-size: 12px;
            }

            .footer {
                position: static;
                margin-top: 20px;
                text-align: center;
                justify-content: center;
                flex-wrap: wrap;
                font-size: 12px;
                padding: 0 8px;
            }
        }

        @media (max-width: 360px) {
            .time-display { font-size: 56px; }
            .main-container { padding: 28px 14px 22px; }
            .tiles-grid { gap: 8px; }
        }

        /* Низкие экраны в альбомной ориентации */
        @media (max-height: 520px) and (orientation: landscape) {
            body { justify-content: flex-start; overflow-y: auto; }
            .main-container { padding: 24px 28px; margin: auto 0; }
            .time-display { font-size: 52px; }
            .date-display, .greeting { margin-bottom: 14px; }
            .search-wrapper { margin-bottom: 20px; }
            .footer { position: static; margin-top: 16px; }
        }

        /* На сенсорных экранах не "прыгаем" плитками при касании */
        @media (hover: none) {
            .tile:hover { transform: none; }
            .tile:active { background: rgba(255, 255, 255, 0.1); }
        }
    </style>
</head>

    <!-- Подвал с реальным годом -->
    <div class="footer">
        <img id="footer-icon" alt="" onerror="this.style.display='none'">
        Мандарин &copy; <span id="year"></span> — браузер, в котором всегда тепло.
    </div>

    <!-- Скрипты -->
    <script>
        // Значок в подвале берём из той же иконки вкладки
        document.getElementById('footer-icon').src = document.querySelector('link[rel="icon"]').href;

        // Устанавливаем текущий год
        document.getElementById('year').textContent = new Date().getFullYear();

        // Часы и приветствие
        function updateTime() {
            const now = new Date();
            
            // Время
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('clock').textContent = `${hours}:${minutes}`;

            // Дата
            const days = ['воскресенье', 'понедельник', 'вторник', 'среда', 'четверг', 'пятница', 'суббота'];
            const months = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
            document.getElementById('date').textContent = `${days[now.getDay()]}, ${now.getDate()} ${months[now.getMonth()]}`;

            // Приветствие
            const hour = now.getHours();
            let greeting = 'Доброй ночи';
            if (hour >= 6 && hour < 12) greeting = 'Доброе утро';
            else if (hour >= 12 && hour < 18) greeting = 'Добрый день';
            else if (hour >= 18 && hour < 24) greeting = 'Добрый вечер';
            
            // Имя (пока статичное, можно заменить через Python)
            document.getElementById('greeting').innerHTML = `${greeting}, <span id="user-name">друг</span>!`;
        }

        updateTime();
        setInterval(updateTime, 1000);
    </script>
