<!DOCTYPE html>
<html lang="ru" data-view="phone">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff8f4">
<title>Мандарин — Стартовая страница</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🍊%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:hsl(28 30% 98%);--surf:hsl(28 25% 95%);--surf2:hsl(28 25% 91%);
  --pri:hsl(28 75% 36%);--onpri:#fff;--pric:hsl(28 95% 87%);--onpric:hsl(28 90% 15%);
  --sec:hsl(28 35% 88%);--onsec:hsl(28 40% 16%);
  --text:hsl(28 15% 10%);--sub:hsl(28 10% 32%);--line:hsl(28 10% 70%);
  color-scheme:light dark;
}
*{box-sizing:border-box;margin:0}
html{background:var(--bg)}
body{
  min-height:100dvh;display:grid;place-items:center;
  padding:max(24px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
  background:var(--bg);color:var(--text);
  font-family:"Google Sans",Roboto,"Segoe UI",system-ui,-apple-system,sans-serif;
  transition:background .3s,color .3s;
}
.wrap{width:100%;display:grid;gap:20px}
.hero{display:grid;gap:6px}
#clock{font-weight:400;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
#date{font-size:1.125rem;color:var(--sub)}
#date::first-letter{text-transform:uppercase}
#hello{font-size:1.5rem;font-weight:500;margin-top:8px}

form{
  display:flex;align-items:center;gap:8px;height:60px;padding:0 6px 0 20px;
  background:var(--surf2);border-radius:30px;transition:box-shadow .2s;
}
form:focus-within{box-shadow:0 0 0 2px var(--pri)}
form svg{flex:none;width:24px;height:24px;fill:var(--sub)}
input{flex:1;min-width:0;height:100%;border:0;outline:0;background:none;font:inherit;font-size:1.0625rem;color:var(--text)}
input::placeholder{color:var(--sub)}
.go{flex:none;height:48px;padding:0 22px;border:0;border-radius:24px;cursor:pointer;background:var(--pri);color:var(--onpri);font:inherit;font-weight:500}
.go:hover{filter:brightness(1.08)}

.panel{display:grid;gap:20px;align-content:start}
.tiles{display:grid;gap:10px;grid-template-columns:repeat(3,1fr)}
.tile{
  display:grid;justify-items:center;align-content:center;gap:10px;
  background:var(--surf);color:var(--text);text-decoration:none;font-weight:500;
  transition:background .15s;
}
.tile:hover{background:var(--surf2)}
.ico{border-radius:50%;display:grid;place-items:center;background:var(--pric);color:var(--onpric);font-weight:700}

footer{display:grid;justify-items:center;gap:10px;color:var(--sub);font-size:.875rem;text-align:center}
.vbtn{height:36px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:none;color:var(--sub);font:inherit;font-size:.875rem;cursor:pointer}
.vbtn:hover{background:var(--surf)}

:focus-visible{outline:2px solid var(--pri);outline-offset:2px}

/* ---------- вид «Телефон» ---------- */
[data-view="phone"] body{padding-bottom:calc(104px + env(safe-area-inset-bottom))}
[data-view="phone"] .wrap{width:min(100%,440px)}
[data-view="phone"] .hero{padding-top:12px}
[data-view="phone"] #clock{font-size:clamp(72px,24vw,112px)}
[data-view="phone"] .tile{min-height:104px;border-radius:24px;padding:14px 6px;font-size:.8125rem}
[data-view="phone"] .ico{width:48px;height:48px;font-size:1rem}
[data-view="phone"] .themes{left:50%;transform:translateX(-50%);bottom:0;width:min(100%,440px);padding:16px 0 calc(16px + env(safe-area-inset-bottom));border-radius:28px 28px 0 0}

/* ---------- вид «ПК» ---------- */
[data-view="pc"] body{padding-left:calc(112px + env(safe-area-inset-left))}
[data-view="pc"] .wrap{width:min(100%,1080px);grid-template-columns:5fr 7fr;gap:24px;align-items:stretch}
[data-view="pc"] .hero{background:var(--pric);color:var(--onpric);border-radius:40px;padding:40px;align-content:end;min-height:440px}
[data-view="pc"] #date{color:var(--onpric);opacity:.8}
[data-view="pc"] #clock{font-size:clamp(72px,8vw,120px)}
[data-view="pc"] form{height:68px;border-radius:34px;padding-left:24px}
[data-view="pc"] .tiles{gap:14px}
[data-view="pc"] .tile{min-height:140px;border-radius:28px;padding:20px 12px;font-size:.9375rem}
[data-view="pc"] .ico{width:56px;height:56px;font-size:1.0625rem}
[data-view="pc"] footer{grid-column:1/-1}
[data-view="pc"] .themes{left:0;top:0;bottom:0;width:80px;flex-direction:column}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="wrap">
  <header class="hero">
    <div id="clock" aria-live="off">00:00</div>
    <div id="date"></div>
    <div id="hello"></div>
  </header>

  <section class="panel">
    <form id="search" role="search" autocomplete="off">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      <input id="q" type="text" name="q" placeholder="Поиск или адрес" enterkeyhint="search" aria-label="Поиск или адрес сайта">
      <button class="go" type="submit">Найти</button>
    </form>

    <nav class="tiles" aria-label="Быстрые ссылки">
      <a class="tile" href="https://www.youtube.com"><span class="ico">YT</span>YouTube</a>
      <a class="tile" href="https://vk.com"><span class="ico">VK</span>ВКонтакте</a>
      <a class="tile" href="https://ru.wikipedia.org"><span class="ico">W</span>Википедия</a>
      <a class="tile" href="https://github.com"><span class="ico">GH</span>GitHub</a>
      <a class="tile" href="https://mail.ru"><span class="ico">@</span>Mail.ru</a>
    </nav>
  </section>

  <footer>
    <div>🍊 Мандарин, браузер, в котором всегда тепло</div>
    <button class="vbtn" id="view" type="button"></button>
  </footer>
</main>

<div class="themes" role="radiogroup" aria-label="Цвет темы" id="themes"></div>

<script>
(function () {
  var SEEDS = [["Мандарин", 28], ["Небо", 215], ["Мята", 150], ["Слива", 285], ["Роза", 335]];
  var SEARCH_URL = "https://duckduckgo.com/?q=";
  var $ = function (s) { return document.querySelector(s); };
  var store = {
    get: function (k, d) { try { var v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };

  // ---- два вида: ПК и телефон (авто выбирает по ширине экрана) ----
  var mode = store.get("view", "auto");
  var NAMES = { auto: "авто", pc: "ПК", phone: "телефон" };
  function applyView() {
    var v = mode === "auto" ? (innerWidth >= 840 ? "pc" : "phone") : mode;
    document.documentElement.setAttribute("data-view", v);
    $("#view").textContent = "Вид: " + NAMES[mode];
  }
  $("#view").onclick = function () {
    mode = mode === "auto" ? "pc" : mode === "pc" ? "phone" : "auto";
    store.set("view", mode); applyView();
  };
  addEventListener("resize", applyView);

    var t = d ? {
      bg: c(18, 8), surf: c(15, 12), surf2: c(15, 17), pri: c(95, 76), onpri: c(90, 14),
      pric: c(70, 24), onpric: c(95, 90), sec: c(25, 26), onsec: c(30, 90),
      text: c(10, 92), sub: c(8, 72), line: c(8, 38)
    } : {
      bg: c(30, 98), surf: c(25, 95), surf2: c(25, 91), pri: c(75, 36), onpri: "#fff",
      pric: c(95, 87), onpric: c(90, 15), sec: c(35, 88), onsec: c(40, 16),
      text: c(15, 10), sub: c(10, 32), line: c(10, 70)
    };
    for (var k in t) document.documentElement.style.setProperty("--" + k, t[k]);
    $('meta[name="theme-color"]').setAttribute("content", t.bg);
    var sw = document.querySelectorAll(".sw");
    for (var i = 0; i < sw.length; i++) sw[i].setAttribute("aria-checked", String(+sw[i].dataset.h === h));
  }
  var themes = $("#themes");
  SEEDS.forEach(function (s) {
    var b = document.createElement("button");
    b.className = "sw"; b.type = "button"; b.dataset.h = s[1];
    b.setAttribute("role", "radio"); b.setAttribute("aria-label", s[0]); b.title = s[0];
    b.style.background = "hsl(" + s[1] + " 80% 55%)";
    b.onclick = function () { store.set("hue", s[1]); applyTheme(); };
    themes.appendChild(b);
  });
  if (dark.addEventListener) dark.addEventListener("change", applyTheme);

  // ---- поиск: адрес открываем, остальное ищем ----
  $("#search").addEventListener("submit", function (e) {
    e.preventDefault();
    var q = $("#q").value.trim();
    if (!q) return;
    var isUrl = /^https?:\/\//i.test(q);
    var looksLikeSite = /^[^\s\/]+\.[a-zа-я]{2,}(\/\S*)?$/i.test(q);
    location.href = (isUrl || looksLikeSite) ? (isUrl ? q : "https://" + q) : SEARCH_URL + encodeURIComponent(q);
  });

  // ---- часы и приветствие ----
  function tick() {
    var n = new Date(), h = n.getHours();
    $("#clock").textContent = String(h).padStart(2, "0") + ":" + String(n.getMinutes()).padStart(2, "0");
    $("#date").textContent = n.toLocaleDateString("ru-RU", { weekday: "long", day: "numeric", month: "long" });
    $("#hello").textContent = h < 5 ? "Доброй ночи" : h < 12 ? "Доброе утро" : h < 18 ? "Добрый день" : "Добрый вечер";
  }
  tick(); setInterval(tick, 1000);
  applyView(); applyTheme();
})();
</script>
</body>
</html>
